<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>せどり動画作成くん</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d14;
  --card: #17171f;
  --card2: #1e1e28;
  --accent: #ff6b35;
  --gold: #ffc844;
  --green: #00d68f;
  --blue: #4d9fff;
  --text: #f2f2f8;
  --muted: #7a7a9a;
  --border: #2a2a3c;
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(13,13,20,0.95);
  backdrop-filter: blur(16px);
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.header h1 { font-size: 16px; font-weight: 900; }
.header-badge {
  margin-left: auto;
  background: rgba(255,107,53,0.15);
  border: 1px solid rgba(255,107,53,0.4);
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: 1px;
}

/* ── PROGRESS DOTS ── */
.progress {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 16px 0;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.3s;
}
.dot.active { background: var(--accent); width: 24px; border-radius: 4px; }
.dot.done { background: var(--green); }

/* ── PAGES ── */
.page { display: none; padding: 16px 16px 100px; }
.page.active { display: block; }

/* ── SECTION LABEL ── */
.sec-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  margin-top: 20px;
  padding-left: 2px;
}
.sec-label:first-child { margin-top: 4px; }

/* ── UPLOAD ── */
.upload-box {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px 16px;
  text-align: center;
  position: relative;
  transition: all 0.2s;
  background: var(--card);
}
.upload-box.has-files { border-color: var(--accent); border-style: solid; }
.upload-box input { position:absolute; inset:0; opacity:0; width:100%; height:100%; }
.upload-emoji { font-size: 36px; margin-bottom: 8px; }
.upload-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.upload-sub { font-size: 12px; color: var(--muted); }

.thumb-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.thumb {
  flex-shrink: 0;
  width: 64px; height: 64px;
  border-radius: 10px;
  background: var(--card2);
  overflow: hidden;
  position: relative;
}
.thumb img { width:100%; height:100%; object-fit:cover; }
.thumb .del {
  position:absolute; top:2px; right:2px;
  background: rgba(0,0,0,0.75);
  border: none; color: #fff;
  border-radius: 50%; width:18px; height:18px;
  font-size:10px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.thumb-video {
  display:flex; align-items:center; justify-content:center;
  font-size: 24px;
}

/* ── INPUTS ── */
.input-card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}
.input-row {
  display: flex;
  flex-direction: column;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  gap: 6px;
}
.input-row:last-child { border-bottom: none; }
.input-row label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}
.input-row input,
.input-row select,
.input-row textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  text-align: left;
  padding: 4px 0 6px;
  outline: none;
  -webkit-appearance: none;
  width: 100%;
}
.input-row textarea {
  resize: none;
  min-height: 64px;
  line-height: 1.6;
}
.input-row select option { background: #1e1e28; }

/* ── NOTE TOGGLE ── */
.toggle-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 14px 16px;
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.toggle-row:last-child { border-bottom: none; }
.toggle-label { font-size: 13px; font-weight: 700; }
.toggle-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.toggle {
  position: relative;
  width: 44px; height: 26px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--border);
  border-radius: 13px;
  transition: 0.2s;
  cursor: pointer;
}
.toggle-slider:before {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  left: 3px; top: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.2s;
}
.toggle input:checked + .toggle-slider { background: var(--accent); }
.toggle input:checked + .toggle-slider:before { transform: translateX(18px); }

/* ── OUTPUT TYPE CHIPS ── */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  background: var(--card);
  user-select: none;
}
.chip.on {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(255,107,53,0.1);
}
.chip .chip-icon { font-size: 16px; }

/* ── BIG BUTTON ── */
.btn-main {
  position: fixed;
  bottom: calc(16px + var(--safe-bottom));
  left: 16px; right: 16px;
  z-index: 40;
  padding: 18px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 100px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 0.5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 8px 32px rgba(255,107,53,0.4);
  transition: all 0.15s;
}
.btn-main:active { transform: scale(0.97); }
.btn-main:disabled { opacity: 0.4; box-shadow: none; }
.btn-secondary {
  width: 100%;
  padding: 14px;
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--text);
  border-radius: 100px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 8px;
}
.btn-secondary:active { background: var(--card2); }

/* ── LOADING ── */
.loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(13,13,20,0.92);
  backdrop-filter: blur(12px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.loading.show { display: flex; }
.spinner {
  width: 52px; height: 52px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title { font-size: 18px; font-weight: 900; color: var(--accent); }
.loading-sub { font-size: 13px; color: var(--muted); text-align: center; max-width: 240px; }

/* ── RESULT PAGE ── */
.profit-bar {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  margin-bottom: 4px;
}
.profit-num {
  font-size: 26px;
  font-weight: 900;
  color: var(--green);
}
.profit-detail { font-size: 12px; color: var(--muted); line-height: 1.6; }
.roi-badge {
  margin-left: auto;
  background: rgba(0,214,143,0.15);
  border: 1px solid rgba(0,214,143,0.3);
  color: var(--green);
  font-size: 13px;
  font-weight: 900;
  padding: 6px 12px;
  border-radius: 100px;
  flex-shrink: 0;
}

/* ── OUTPUT TABS (scroll) ── */
.tab-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 0 8px;
  scrollbar-width: none;
}
.tab-scroll::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  background: var(--card);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.tab-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* ── RESULT BLOCKS ── */
.pane { display: none; }
.pane.active { display: block; }

.result-block {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 10px;
  overflow: hidden;
}
.result-block-head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.result-block-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}
.copy-pill {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 100px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  flex-shrink: 0;
}
.copy-pill.copied { background: rgba(0,214,143,0.15); border-color: var(--green); color: var(--green); }
.result-block-body {
  padding: 14px;
  font-size: 14px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-all;
}
.result-block-body.large { font-size: 18px; font-weight: 900; line-height: 1.3; }
.result-block-body.accent { color: var(--accent); }
.result-block-body.gold { color: var(--gold); font-weight: 700; }

.tag-wrap {
  padding: 12px 14px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tag {
  background: rgba(255,200,68,0.1);
  border: 1px solid rgba(255,200,68,0.25);
  color: var(--gold);
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.tag:active { background: rgba(255,200,68,0.2); }

/* timeline */
.tl-item {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.tl-item:last-child { border-bottom: none; }
.tl-time {
  font-size: 11px;
  color: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
  width: 52px;
  margin-top: 2px;
}
.tl-text { font-size: 14px; font-weight: 700; flex: 1; }
.tl-style { font-size: 11px; color: var(--muted); margin-top: 3px; }
.tl-copy {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  padding: 4px;
}

/* canva preview */
.canva-preview {
  margin: 14px;
  border-radius: 12px;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 24px 16px;
  position: relative;
  background: #111;
}
.canva-main { font-size: 24px; font-weight: 900; color: white; text-align: center; }
.canva-sub { font-size: 14px; color: #aaa; text-align: center; }
.canva-badge {
  position: absolute;
  top: 10px; right: 10px;
  background: var(--accent);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
}

/* note lock */
.note-lock {
  background: rgba(255,200,68,0.08);
  border: 1px dashed rgba(255,200,68,0.3);
  border-radius: 10px;
  margin: 10px;
  padding: 12px;
}
.note-lock-header {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

/* reset btn */
.reset-area {
  padding: 20px 0 8px;
  text-align: center;
}
.reset-btn {
  background: none;
  border: 1.5px solid var(--border);
  color: var(--muted);
  border-radius: 100px;
  padding: 10px 24px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

/* ── PRODUCT TABS ── */
.product-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.product-tab {
  flex: 1;
  padding: 10px 8px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  background: var(--card);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.product-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.product-tab.filled {
  border-color: var(--green);
  color: var(--green);
}
.product-tab.filled.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.add-product-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 12px;
  background: var(--card);
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  margin-top: 12px;
}
.add-product-btn:active { background: var(--card2); }
.remove-product-btn {
  background: rgba(255,60,60,0.1);
  border: 1px solid rgba(255,60,60,0.3);
  color: #ff6060;
  border-radius: 100px;
  padding: 6px 14px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

/* ── VIDEO GEN ── */
.video-gen-area {
  margin-top: 16px;
  padding: 16px;
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.video-gen-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 100px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.video-gen-btn:disabled { opacity: 0.4; }
.video-preview {
  margin-top: 12px;
  border-radius: 12px;
  overflow: hidden;
}
.video-preview video {
  width: 100%;
  border-radius: 12px;
}
.video-download-btn {
  width: 100%;
  padding: 12px;
  background: var(--green);
  color: var(--bg);
  border: none;
  border-radius: 100px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  margin-top: 8px;
}

/* ── DISCLAIMER ── */
.disclaimer {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(255,200,68,0.08);
  border: 1px solid rgba(255,200,68,0.2);
  border-radius: 8px;
  font-size: 11px;
  color: var(--gold);
  line-height: 1.6;
}

/* ── PROFIT SUMMARY (multi product) ── */
.profit-summary {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 10px;
  overflow: hidden;
}
.profit-summary-item {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.profit-summary-item:last-child { border-bottom: none; }
.profit-summary-name { font-size: 13px; font-weight: 700; }
.profit-summary-num { font-size: 15px; font-weight: 900; color: var(--green); }

/* ── SCAN BUTTON ── */
.scan-btn {
  width: 100%;
  padding: 12px;
  background: rgba(77,159,255,0.1);
  border: 1.5px solid rgba(77,159,255,0.3);
  color: var(--blue);
  border-radius: 100px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.scan-btn:disabled { opacity: 0.4; }
.scan-btn.done { border-color: var(--green); color: var(--green); background: rgba(0,214,143,0.1); }

/* ── API KEY MODAL ── */
.api-modal {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(13,13,20,0.95);
  backdrop-filter: blur(16px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.api-modal.hidden { display: none; }
.api-modal-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 20px;
  max-width: 380px;
  width: 100%;
  text-align: center;
}
.api-modal-card h2 {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 8px;
}
.api-modal-card p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
  line-height: 1.6;
}
.api-modal-card input {
  width: 100%;
  padding: 12px 14px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  margin-bottom: 14px;
}
.api-modal-card input:focus {
  border-color: var(--accent);
}
.api-modal-card .api-save-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 100px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
}
.api-modal-card .api-save-btn:disabled {
  opacity: 0.4;
}
.api-key-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,214,143,0.1);
  border: 1px solid rgba(0,214,143,0.3);
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
}
.api-key-badge.not-set {
  background: rgba(255,60,60,0.1);
  border-color: rgba(255,60,60,0.3);
  color: #ff6060;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-icon">🏷️</div>
  <h1>せどり動画作成くん</h1>
</div>

<!-- PROGRESS -->
<div class="progress">
  <div class="dot active" id="dot0"></div>
  <div class="dot" id="dot1"></div>
  <div class="dot" id="dot2"></div>
  <div class="dot" id="dot3"></div>
</div>

<!-- ══ PAGE 0: 商品情報 ══ -->
<div class="page active" id="page0">

  <div class="product-tabs" id="productTabs"></div>
  <div id="productForms"></div>
  <button class="add-product-btn" id="addProductBtn" onclick="addProduct()">＋ 商品を追加</button>

  <div class="sec-label">📝 noteに載せる範囲</div>
  <div class="toggle-card">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">商品名をnote有料部分に載せる</div>

<script>
// ── state ──
let currentPage = 0;
let result = null;
let products = []; // array of {files, name, category, buyPrice, sellPrice, location, comment}
let activeProductIdx = 0;

// ── API key management ──
function getApiKey() {
  return localStorage.getItem('sedori_api_key') || '';
}
function showApiModal() {
  document.getElementById('apiKeyInput').value = getApiKey();
  document.getElementById('apiModal').classList.remove('hidden');
}
function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (key) {
    localStorage.setItem('sedori_api_key', key);
    document.getElementById('apiModal').classList.add('hidden');
    updateApiKeyBadge();
  }
}
function updateApiKeyBadge() {
  const badge = document.getElementById('apiKeyBadge');
  if (getApiKey()) {
    badge.textContent = '🔑 設定済み';
    badge.classList.remove('not-set');
  } else {
    badge.textContent = '🔑 未設定';
    badge.classList.add('not-set');
  }
}
updateApiKeyBadge();

// ── multi-product management ──
function createProductData() {
  return { files: [], name: '', category: 'おもちゃ・ゲーム', buyPrice: '', sellPrice: '', location: '', comment: '' };
}

function saveCurrentProduct() {
  const form = document.getElementById('productForm-' + activeProductIdx);
  if (!form) return;
  const p = products[activeProductIdx];
  p.name = form.querySelector('.p-name').value;
  p.category = form.querySelector('.p-cat').value;
  p.buyPrice = form.querySelector('.p-buy').value;
  p.sellPrice = form.querySelector('.p-sell').value;
  p.location = form.querySelector('.p-loc').value;
  p.comment = form.querySelector('.p-memo').value;
}

function renderProductTabs() {
  const tabsEl = document.getElementById('productTabs');
  if (products.length <= 1) {
    tabsEl.innerHTML = '';
  } else {
    tabsEl.innerHTML = products.map((p, i) => {
      const filled = p.name && p.buyPrice && p.sellPrice;
      return `<button class="product-tab${i === activeProductIdx ? ' active' : ''}${filled ? ' filled' : ''}" onclick="switchProduct(${i})">📦 商品${i + 1}</button>`;
    }).join('');
  }
  document.getElementById('addProductBtn').style.display = products.length >= 3 ? 'none' : 'flex';
}

function renderProductForm(idx) {
  const p = products[idx];
  const formsEl = document.getElementById('productForms');
  formsEl.innerHTML = `
    <div id="productForm-${idx}">
      <div class="sec-label" style="margin-top:12px;">📸 写真・動画</div>
      <input type="file" class="p-file-input" accept="image/*,video/*" multiple style="display:none">
      <div class="upload-box" onclick="this.previousElementSibling.click()">
        <div class="upload-emoji">📁</div>
        <div class="upload-title">タップして選択</div>
        <div class="upload-sub">写真・動画 複数OK</div>
      </div>
      <div class="thumb-row p-thumbs"></div>

      <button class="scan-btn" onclick="scanProduct(${idx})">📷 写真から商品名を読み取る</button>

      <div class="sec-label">💰 商品情報</div>
      <div class="input-card">
        <div class="input-row"><label>商品名</label><input type="text" class="p-name" placeholder="例：レゴ 10302" value="${esc2(p.name)}"></div>
        <div class="input-row"><label>カテゴリー</label>
          <select class="p-cat">
            ${['おもちゃ・ゲーム','家電・スマホ','ブランド品','本・CD・DVD','スポーツ用品','食品・飲料','その他'].map(c => `<option${c===p.category?' selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="input-row"><label>仕入れ値</label><input type="number" class="p-buy" placeholder="2800" inputmode="numeric" value="${p.buyPrice}"></div>
        <div class="input-row"><label>売値</label><input type="number" class="p-sell" placeholder="6500" inputmode="numeric" value="${p.sellPrice}"></div>
        <div class="input-row"><label>仕入れ先</label><input type="text" class="p-loc" placeholder="ドンキ・非公開 など" value="${esc2(p.location)}"></div>
        <div class="input-row"><label>メモ</label><textarea class="p-memo" placeholder="状態・失敗談・ポイントなど">${esc2(p.comment)}</textarea></div>
      </div>
      ${products.length > 1 ? `<button class="remove-product-btn" onclick="removeProduct(${idx})">✕ この商品を削除</button>` : ''}
    </div>
  `;

  // file input — auto-split: 2 images per product (front + back)
  const fileInput = formsEl.querySelector('.p-file-input');
  fileInput.addEventListener('change', e => {
    const newFiles = [...e.target.files].filter(f => f.type.startsWith('image/'));
    for (const f of newFiles) {
      const currentProduct = products[activeProductIdx];
      const imageCount = currentProduct.files.filter(x => x.type.startsWith('image/')).length;
      if (imageCount >= 2 && products.length < 3) {
        // Current product already has 2 images → auto-create next product
        saveCurrentProduct();
        products.push(createProductData());
        activeProductIdx = products.length - 1;
        products[activeProductIdx].files.push(f);
        renderProductTabs();
        renderProductForm(activeProductIdx);
        return; // re-render triggers new file input, stop processing here
      } else {
        addFileToProduct(activeProductIdx, f);
      }
    }
    fileInput.value = '';
  });

  // render existing thumbs
  renderThumbs(idx);
}

function esc2(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function addFileToProduct(idx, f) {
  products[idx].files.push(f);
  if (idx === activeProductIdx) renderThumbs(idx);
}

// ── scan product from photo ──
async function scanProduct(idx) {
  const p = products[idx];
  const imgFile = p.files.find(f => f.type.startsWith('image/'));
  if (!imgFile) { alert('先に写真を追加してください'); return; }

  const btn = document.querySelector('.scan-btn');
  btn.disabled = true;
  btn.textContent = '📷 読み取り中…';

  try {
    // Compress image before sending (max 800px, quality 0.7)
    const base64 = await compressImage(imgFile, 800, 800, 0.7);

    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
    let result;

    if (isLocal) {
      const localKey = getApiKey();
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localKey}` },
        body: JSON.stringify({
          model: 'meta-llama/llama-4-scout-17b-16e-instruct',
          messages: [{ role: 'user', content: [
            { type: 'text', text: '商品画像から商品名・型番・カテゴリを読み取ってJSONで返して。{"productName":"","modelNumber":"","category":"おもちゃ・ゲーム/家電・スマホ/ブランド品/本・CD・DVD/スポーツ用品/食品・飲料/その他のいずれか"}' },
            { type: 'image_url', image_url: { url: base64 } }
          ]}],
          temperature: 0.3, max_tokens: 300
        })
      });
      const data = await res.json();
      const text = (data.choices?.[0]?.message?.content || '').replace(/```json|```/g, '').trim();
      result = JSON.parse(text);
    } else {
      const apiUrl = window.location.origin + '/api/vision';
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64 })
      });
      result = await res.json();
      if (result.error) throw new Error(result.error);
    }

    // Fill form
    const form = document.getElementById('productForm-' + idx);
    if (result.productName) {
      const modelStr = result.modelNumber ? ' ' + result.modelNumber : '';
      form.querySelector('.p-name').value = result.productName + modelStr;
    }
    if (result.category) {
      const sel = form.querySelector('.p-cat');
      const opts = [...sel.options].map(o => o.value);
      if (opts.includes(result.category)) sel.value = result.category;
    }
    saveCurrentProduct();

    btn.textContent = '✓ 読み取り完了';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = '📷 写真から商品名を読み取る'; btn.classList.remove('done'); btn.disabled = false; }, 3000);
  } catch (e) {
    btn.textContent = '📷 写真から商品名を読み取る';
    btn.disabled = false;
    const errDiv = document.getElementById('errorMsg');
    errDiv.textContent = '⚠️ 読み取りエラー: ' + e.message;
    errDiv.style.display = 'block';
  }
}

function renderThumbs(idx) {
  const thumbRow = document.querySelector('.p-thumbs');
  if (!thumbRow) return;
  thumbRow.innerHTML = '';
  const uploadBox = document.querySelector('.upload-box');
  uploadBox.classList.toggle('has-files', products[idx].files.length > 0);

  products[idx].files.forEach((f, fi) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    if (f.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      div.appendChild(img);
    } else {
      div.classList.add('thumb-video');
      div.textContent = '🎬';
    }
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); products[idx].files.splice(fi, 1); renderThumbs(idx); };
    div.appendChild(del);
    thumbRow.appendChild(div);
  });
}

function switchProduct(idx) {
  saveCurrentProduct();
  activeProductIdx = idx;
  renderProductTabs();
  renderProductForm(idx);
}

function addProduct() {
  if (products.length >= 3) return;
  saveCurrentProduct();
  products.push(createProductData());
  activeProductIdx = products.length - 1;
  renderProductTabs();
  renderProductForm(activeProductIdx);
}

function removeProduct(idx) {
  products.splice(idx, 1);
  if (activeProductIdx >= products.length) activeProductIdx = products.length - 1;
  renderProductTabs();
  renderProductForm(activeProductIdx);
}

// init first product
products.push(createProductData());
renderProductTabs();
renderProductForm(0);

// ── chips ──
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => c.classList.toggle('on'));
});

// ── main button ──
async function handleMain() {
  if (currentPage === 0) await generate();
}

// ── generate ──
async function generate() {
  saveCurrentProduct();

  // validate all products
  const validProducts = products.filter(p => p.name && p.buyPrice && p.sellPrice);
  if (!validProducts.length) { alert('商品名・仕入れ値・売値を入力してください'); return; }

  const types = [...document.querySelectorAll('.chip.on')].map(c => c.dataset.type);

  const productInfoText = validProducts.map((p, i) => {

  const noteInstruction = `

- 仕入れ値・売値：${showPrice ? '有料部分にのみ記載すること（無料部分には載せない）' : '価格情報は一切記載しないこと'}

`;

  const multiProductNote = validProducts.length > 1
    ? `\n※今回は${validProducts.length}つの商品をまとめて紹介する形式で書くこと。TikTok/Instagram/Canvaは最もインパクトのある商品1つにフォーカスし、noteは全商品をカバーすること。`
    : '';

  const prompt = `あなたはせどり・転売ビジネスのSNSコンテンツ専門家です。

${productInfoText}

【重要な表示ルール】
- TikTok（フック・タイトル・キャプション・テロップ）、Instagram、Canva、動画字幕では「商品名」を出さず、カテゴリー名（例：「家電」「おもちゃ」）だけで表現すること
- note記事でのみ商品名をそのまま使ってOK

${noteInstruction}${multiProductNote}

以下のJSONのみ出力（説明文・コードブロック記号は不要）:
{
  "tiktok":{
    "hook":"最初の3秒フック（20字以内・「え、これ○○円！？」「○○が○○円で買えるの知ってた？」「これ知らないと損」系の驚き・煽り系で。商品名は出さずカテゴリーで）",
    "title":"動画タイトル（30字以内・商品名は出さずカテゴリーで）",

      {"text":"字幕3","start":"0:08","end":"0:13","style":"スタイル提案"},
      {"text":"字幕4","start":"0:13","end":"0:18","style":"スタイル提案"},
      {"text":"字幕5","start":"0:18","end":"0:23","style":"スタイル提案"},
      {"text":"字幕6","start":"0:23","end":"0:28","style":"スタイル提案"},

日本語・せどり初〜中級者向け・リアルで共感しやすいトーンで。`;

  // loading

  let mi = 0;
  const iv = setInterval(() => { document.getElementById('loadingSub').textContent = msgs[mi++ % msgs.length]; }, 1200);

    const localKey = getApiKey();

          temperature: 0.8, max_tokens: 4096,
          response_format: { type: 'json_object' }
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(`APIエラー ${res.status}: ${JSON.stringify(data)}`);
      raw = (data.choices?.[0]?.message?.content || '').replace(/```json|```/g, '').trim();
    } else {
      const fetchHeaders = { 'Content-Type': 'application/json' };
      if (localKey) fetchHeaders['x-api-key'] = localKey;
      const apiUrl = window.location.origin + '/api/generate';
      const res = await fetch(apiUrl, { method: 'POST', headers: fetchHeaders, body: JSON.stringify({ prompt }) });
      const data = await res.json();
      if (!res.ok) throw new Error(`APIエラー ${res.status}: ${JSON.stringify(data)}`);
      raw = (data.text || '').replace(/```json|```/g, '').trim();
    }

    let result;
    try { result = JSON.parse(raw); } catch(pe) { throw new Error('JSON解析エラー。AIの返答:\n' + raw.slice(0, 300)); }

    await renderResult(result, types, totalProfit, totalRoi, totalBuy, totalSell, validProducts);
    goPage(3);

  } catch(e) {

    errDiv.style.display = 'block';

// ── render result ──
async function renderResult(r, types, profit, roi, buy, sell, prods) {
  // profit bar
  let profitHtml = `<div class="profit-bar">

// ── video generation (browser-based) ──
async function generateVideo() {
  const btn = document.getElementById('videoGenBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 動画を生成中…';
  const resultDiv = document.getElementById('videoResult');
  resultDiv.innerHTML = '<p style="font-size:12px;color:var(--muted);margin-top:12px;">ブラウザ内で動画を生成中…10〜20秒ほどかかります</p>';

  try {
    const r = window._lastResult;
    const prods = window._lastProducts || [];

    // Read edited values from UI
    const hook = document.getElementById('vidHook')?.value || r.tiktok?.hook || '';
    const priceBadge = document.getElementById('vidBadge')?.value || r.canva?.price_badge || '';

    // Profit data for profit bar display
    const validProds = prods.filter(p => p.name && p.buyPrice && p.sellPrice);
    const totalProfit = validProds.reduce((s, p) => s + (parseInt(p.sellPrice) - parseInt(p.buyPrice)), 0);
    const totalBuy = validProds.reduce((s, p) => s + parseInt(p.buyPrice), 0);
    const totalRoi = totalBuy > 0 ? Math.round(totalProfit / totalBuy * 100) : 0;
    const ctaText = document.getElementById('vidCta')?.value || '詳しくはnoteで👇';
    const captionInputs = document.querySelectorAll('.vid-caption');
    const captions = (r.tiktok_studio?.captions || []).map((c, i) => ({
      ...c,
      text: captionInputs[i]?.value || c.text
    }));

    // Font size
    const sizeMap = { small: { hook: 40, sub: 28, badge: 22 }, medium: { hook: 52, sub: 36, badge: 28 }, large: { hook: 64, sub: 44, badge: 34 } };
    const fs = sizeMap[window._vidFontSize || 'medium'];

    // Load product image
    let bgImage = null;
    const prodWithImage = prods.find(p => p.files && p.files.some(f => f.type.startsWith('image/')));
    if (prodWithImage) {
      const imgFile = prodWithImage.files.find(f => f.type.startsWith('image/'));
      bgImage = await loadImage(imgFile);
    }

    // Canvas setup (9:16 vertical)
    const W = 720, H = 1280;
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    // MediaRecorder setup
    const stream = canvas.captureStream(25);
    const chunks = [];
    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 2500000 });
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

    const videoReady = new Promise(resolve => { recorder.onstop = () => resolve(); });
    recorder.start();

    // Total duration & frame rendering
    const totalDuration = 30;
    const fps = 25;
    const totalFrames = totalDuration * fps;

    // Helper: draw outlined text with glow + pop animation
    const drawText = (text, x, y, color, fontSize, maxW, lineH, popProgress) => {
      const scale = popProgress !== undefined ? Math.min(popProgress * 1.2, 1) * (popProgress < 0.3 ? 0.8 + popProgress * 0.67 : 1) : 1;
      ctx.save();
      if (scale !== 1) { ctx.translate(x, y); ctx.scale(scale, scale); ctx.translate(-x, -y); }
      ctx.font = `900 ${fontSize}px "Hiragino Sans", "Yu Gothic", sans-serif`;
      ctx.textAlign = 'center';
      ctx.shadowColor = color; ctx.shadowBlur = 16;
      ctx.strokeStyle = 'rgba(0,0,0,0.9)'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
      wrapTextStroke(ctx, text, x, y, maxW, lineH);
      ctx.fillStyle = color; ctx.shadowBlur = 0;
      wrapText(ctx, text, x, y, maxW, lineH);
      ctx.restore();
    };

    for (let frame = 0; frame < totalFrames; frame++) {
      const t = frame / fps; // current time in seconds

      // Background with slow zoom effect
      ctx.save();
      const zoom = 1 + (t / totalDuration) * 0.15; // 1.0 → 1.15 over 30s
      ctx.translate(W / 2, H / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-W / 2, -H / 2);
      if (bgImage) {
        const scale = Math.max(W / bgImage.width, H / bgImage.height);
        const w = bgImage.width * scale;
        const h = bgImage.height * scale;
        ctx.drawImage(bgImage, (W - w) / 2, (H - h) / 2, w, h);
        // Blur: shrink → stretch back (Safari compatible)
        const blurLevel = parseInt(window._vidBlur || '20');
        const blurDiv = Math.max(Math.ceil(blurLevel * 1.5), 4);
        const blurC = document.createElement('canvas');
        blurC.width = Math.ceil(W / blurDiv);
        blurC.height = Math.ceil(H / blurDiv);
        const blurCtx = blurC.getContext('2d');
        blurCtx.drawImage(canvas, 0, 0, blurC.width, blurC.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(blurC, 0, 0, W, H);
      } else {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#1a1a2e');
        grad.addColorStop(0.5, '#16213e');
        grad.addColorStop(1, '#0f3460');
        ctx.fillStyle = grad;
        ctx.fillRect(-50, -50, W + 100, H + 100);
      }
      ctx.restore();
      // Dark overlay
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);

      // Hook text (0-3 seconds) — pop-up animation
      if (t < 3) {
        const alpha = t < 0.5 ? t / 0.5 : (t > 2.5 ? (3 - t) / 0.5 : 1);
        const pop = Math.min(t / 0.2, 1); // quick pop in 0.2s
        ctx.globalAlpha = alpha;
        drawText(hook, W / 2, H / 2, '#ff6b35', fs.hook, W - 60, fs.hook + 12, pop);
        ctx.globalAlpha = 1;
      }

      // Profit bar (3-27 seconds) — same design as result screen
      if (t >= 3 && t < 27 && totalProfit > 0) {
        const barPop = Math.min((t - 3) / 0.3, 1);
        const barScale = barPop < 1 ? 0.7 + barPop * 0.3 : 1;
        const barAlpha = barPop;
        ctx.save();
        ctx.globalAlpha = barAlpha;
        const barX = 30, barY = 40, barW = W - 60, barH = 100;
        ctx.translate(barX + barW / 2, barY + barH / 2);
        ctx.scale(barScale, barScale);
        ctx.translate(-(barX + barW / 2), -(barY + barH / 2));

        // Bar background
        ctx.fillStyle = 'rgba(23,23,31,0.85)';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 16;
        roundRect(ctx, barX, barY, barW, barH, 16);
        ctx.fill();
        ctx.shadowBlur = 0;
        // Border
        ctx.strokeStyle = 'rgba(42,42,60,0.8)';
        ctx.lineWidth = 1.5;
        roundRect(ctx, barX, barY, barW, barH, 16);
        ctx.stroke();

        // +¥profit (green, large)
        ctx.font = `900 38px "Hiragino Sans", "Yu Gothic", sans-serif`;
        ctx.fillStyle = '#00d68f';
        ctx.textAlign = 'left';
        ctx.fillText(`+¥${totalProfit.toLocaleString()}`, barX + 18, barY + 45);

        // Sub text
        ctx.font = `700 14px "Hiragino Sans", "Yu Gothic", sans-serif`;
        ctx.fillStyle = '#7a7a9a';
        ctx.fillText(`仕入れ ¥${totalBuy.toLocaleString()} → 売値 ¥${(totalBuy + totalProfit).toLocaleString()}`, barX + 18, barY + 72);

        // ROI badge (right side)
        const roiText = `ROI ${totalRoi}%`;
        ctx.font = `900 16px "Hiragino Sans", "Yu Gothic", sans-serif`;
        const roiW = ctx.measureText(roiText).width + 24;
        const roiX = barX + barW - roiW - 16;
        const roiY = barY + 30;
        ctx.fillStyle = 'rgba(0,214,143,0.15)';
        ctx.strokeStyle = 'rgba(0,214,143,0.3)';
        ctx.lineWidth = 1;
        roundRect(ctx, roiX, roiY, roiW, 36, 18);
        ctx.fill();
        roundRect(ctx, roiX, roiY, roiW, 36, 18);
        ctx.stroke();
        ctx.fillStyle = '#00d68f';
        ctx.textAlign = 'center';
        ctx.fillText(roiText, roiX + roiW / 2, roiY + 24);

        ctx.globalAlpha = 1;
        ctx.restore();
      }

      // Subtitles — pop-up animation
      for (const cap of captions) {
        const start = parseTime(cap.start);
        const end = parseTime(cap.end);
        if (t >= start && t < end) {
          const elapsed = t - start;
          const fadeOut = Math.min((end - t) / 0.3, 1);
          const pop = Math.min(elapsed / 0.15, 1);
          ctx.globalAlpha = fadeOut;
          drawText(cap.text, W / 2, H - 180, '#ffffff', fs.sub, W - 40, fs.sub + 10, pop);
          ctx.globalAlpha = 1;
          break;
        }
      }

      // CTA (27-30 seconds) — pop-up
      if (t >= 27) {
        const elapsed = t - 27;
        const alpha = Math.min(elapsed / 0.5, 1);
        const pop = Math.min(elapsed / 0.3, 1);
        ctx.globalAlpha = alpha;
        drawText(ctaText, W / 2, H / 2 + 100, '#ffc844', fs.sub, W - 60, fs.sub + 10, pop);
        ctx.globalAlpha = 1;
      }

      // Progress update
      if (frame % 50 === 0) {
        btn.textContent = `⏳ 生成中… ${Math.round(frame / totalFrames * 100)}%`;
        await new Promise(r => setTimeout(r, 0));
      }

      // Wait for next frame timing
      await new Promise(r => setTimeout(r, 1000 / fps));
    }

    recorder.stop();
    await videoReady;

    const blob = new Blob(chunks, { type: 'video/webm' });
    const videoUrl = URL.createObjectURL(blob);

    resultDiv.innerHTML = `
      <div class="video-preview" style="margin-top:12px;">
        <video src="${videoUrl}" controls playsinline style="width:100%;max-height:400px;border-radius:12px;"></video>
      </div>
      <a href="${videoUrl}" download="sedori-video.webm" class="video-download-btn" style="display:block;text-align:center;text-decoration:none;margin-top:8px;">
        📥 動画をダウンロード
      </a>
    `;
    btn.textContent = '✓ 生成完了';
  } catch (e) {
    resultDiv.innerHTML = `<p style="font-size:12px;color:#ff6060;margin-top:12px;">⚠️ ${e.message}</p>`;
    btn.textContent = '🎬 動画を生成する';
    btn.disabled = false;
  }
}

function loadImage(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.src = URL.createObjectURL(file);
  });
}

function parseTime(t) {
  const parts = (t || '0:00').split(':');
  if (parts.length === 2) return parseInt(parts[0]) * 60 + parseInt(parts[1]);
  return parseInt(parts[0]);
}

function wrapTextStroke(ctx, text, x, y, maxWidth, lineHeight) {
  const chars = text.split('');
  let line = '';
  let ty = y;
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.strokeText(line, x, ty);
      line = ch;
      ty += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.strokeText(line, x, ty);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const chars = text.split('');
  let line = '';
  let ty = y;
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, ty);
      line = ch;
      ty += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, ty);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── image compress (for vision scan) ──
function compressImage(file, maxW, maxH, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const scale = Math.min(maxW / img.width, maxH / img.height, 1);
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = URL.createObjectURL(file);
  });
}

function block(label, text, bodyClass) {
  const id = 'b' + Math.random().toString(36).slice(2);
  return `
    <div class="result-block">
      <div class="result-block-head">
        <span class="result-block-label">${label}</span>
        <button class="copy-pill" id="${id}" onclick="cp(this,'${esc(text)}')">コピー</button>
      </div>
      <div class="result-block-body ${bodyClass||''}">${text}</div>
    </div>
  `;
}

function esc(s) {
  if (Array.isArray(s)) s = s.join('\n');
  if (typeof s !== 'string') s = String(s || '');
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
}

function cp(btn, text) {
  const decoded = text.replace(/\\n/g,'\n').replace(/\\'/g,"'").replace(/\\\\/g,'\\');
  navigator.clipboard.writeText(decoded).then(() => {
    btn.textContent = '✓ コピー済み';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── page nav ──
function goPage(n) {
  document.querySelectorAll('.page').forEach((p,i) => p.classList.toggle('active', i === n || (n===3 && i===3)));
  // fix: show page3 which is index 1 in DOM
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  if (n === 0) document.getElementById('page0').classList.add('active');
  if (n === 3) document.getElementById('page3').classList.add('active');
  currentPage = n;
  updateDots();
  updateBtn();
  window.scrollTo(0, 0);
}

function updateDots() {
  const pageIdx = currentPage === 3 ? 3 : currentPage;
  [0,1,2,3].forEach(i => {
    const d = document.getElementById('dot'+i);
    d.classList.remove('active','done');
    if (i < pageIdx) d.classList.add('done');
    else if (i === pageIdx) d.classList.add('active');
  });
}

function updateBtn() {
  const btn = document.getElementById('mainBtn');
  if (currentPage === 0) { btn.textContent = '⚡ AIでコンテンツを生成'; btn.style.display = 'flex'; }
  else { btn.style.display = 'none'; }
}

function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
}

function reset() {
  result = null;
  products = [createProductData()];
  activeProductIdx = 0;
  renderProductTabs();
  renderProductForm(0);
  document.querySelectorAll('.chip').forEach(c => c.classList.add('on'));
  document.getElementById('videoArea').innerHTML = '';
  goPage(0);
}
</script>
