<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>せどりAI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d14;
  --card: #17171f;
  --card2: #1e1e28;
  --accent: #ff6b35;
  --gold: #ffc844;
  --green: #00d68f;
  --blue: #4d9fff;
  --text: #f2f2f8;
  --muted: #7a7a9a;
  --border: #2a2a3c;
  --radius: 16px;
  --safe-bottom: env(safe-area-inset-bottom, 16px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* ── HEADER ── */
.header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(13,13,20,0.95);
  backdrop-filter: blur(16px);
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-icon {
  width: 36px; height: 36px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.header h1 { font-size: 16px; font-weight: 900; }
.header-badge {
  margin-left: auto;
  background: rgba(255,107,53,0.15);
  border: 1px solid rgba(255,107,53,0.4);
  color: var(--accent);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 20px;
  letter-spacing: 1px;
}

/* ── PROGRESS DOTS ── */
.progress {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 14px 16px 0;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  transition: all 0.3s;
}
.dot.active { background: var(--accent); width: 24px; border-radius: 4px; }
.dot.done { background: var(--green); }

/* ── PAGES ── */
.page { display: none; padding: 16px 16px 100px; }
.page.active { display: block; }

/* ── SECTION LABEL ── */
.sec-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  margin-top: 20px;
  padding-left: 2px;
}
.sec-label:first-child { margin-top: 4px; }

/* ── UPLOAD ── */
.upload-box {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 32px 16px;
  text-align: center;
  position: relative;
  transition: all 0.2s;
  background: var(--card);
}
.upload-box.has-files { border-color: var(--accent); border-style: solid; }
.upload-box input { position:absolute; inset:0; opacity:0; width:100%; height:100%; }
.upload-emoji { font-size: 36px; margin-bottom: 8px; }
.upload-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.upload-sub { font-size: 12px; color: var(--muted); }

.thumb-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.thumb {
  flex-shrink: 0;
  width: 64px; height: 64px;
  border-radius: 10px;
  background: var(--card2);
  overflow: hidden;
  position: relative;
}
.thumb img { width:100%; height:100%; object-fit:cover; }
.thumb .del {
  position:absolute; top:2px; right:2px;
  background: rgba(0,0,0,0.75);
  border: none; color: #fff;
  border-radius: 50%; width:18px; height:18px;
  font-size:10px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.thumb-video {
  display:flex; align-items:center; justify-content:center;
  font-size: 24px;
}

/* ── INPUTS ── */
.input-card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}
.input-row {
  display: flex;
  flex-direction: column;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  gap: 6px;
}
.input-row:last-child { border-bottom: none; }
.input-row label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}
.input-row input,
.input-row select,
.input-row textarea {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  text-align: left;
  padding: 4px 0 6px;
  outline: none;
  -webkit-appearance: none;
  width: 100%;
}
.input-row textarea {
  resize: none;
  min-height: 64px;
  line-height: 1.6;
}
.input-row select option { background: #1e1e28; }

/* ── NOTE TOGGLE ── */
.toggle-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 14px 16px;
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.toggle-row:last-child { border-bottom: none; }
.toggle-label { font-size: 13px; font-weight: 700; }
.toggle-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.toggle {
  position: relative;
  width: 44px; height: 26px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--border);
  border-radius: 13px;
  transition: 0.2s;
  cursor: pointer;
}
.toggle-slider:before {
  content: '';
  position: absolute;
  width: 20px; height: 20px;
  left: 3px; top: 3px;
  background: white;
  border-radius: 50%;
  transition: 0.2s;
}
.toggle input:checked + .toggle-slider { background: var(--accent); }
.toggle input:checked + .toggle-slider:before { transform: translateX(18px); }

/* ── OUTPUT TYPE CHIPS ── */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  background: var(--card);
  user-select: none;
}
.chip.on {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(255,107,53,0.1);
}
.chip .chip-icon { font-size: 16px; }

/* ── BIG BUTTON ── */
.btn-main {
  position: fixed;
  bottom: calc(16px + var(--safe-bottom));
  left: 16px; right: 16px;
  z-index: 40;
  padding: 18px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 100px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 0.5px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 8px 32px rgba(255,107,53,0.4);
  transition: all 0.15s;
}
.btn-main:active { transform: scale(0.97); }
.btn-main:disabled { opacity: 0.4; box-shadow: none; }
.btn-secondary {
  width: 100%;
  padding: 14px;
  background: var(--card);
  border: 1.5px solid var(--border);
  color: var(--text);
  border-radius: 100px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  margin-top: 8px;
}
.btn-secondary:active { background: var(--card2); }

/* ── LOADING ── */
.loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(13,13,20,0.92);
  backdrop-filter: blur(12px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
}
.loading.show { display: flex; }
.spinner {
  width: 52px; height: 52px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title { font-size: 18px; font-weight: 900; color: var(--accent); }
.loading-sub { font-size: 13px; color: var(--muted); text-align: center; max-width: 240px; }

/* ── RESULT PAGE ── */
.profit-bar {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  margin-bottom: 4px;
}
.profit-num {
  font-size: 26px;
  font-weight: 900;
  color: var(--green);
}
.profit-detail { font-size: 12px; color: var(--muted); line-height: 1.6; }
.roi-badge {
  margin-left: auto;
  background: rgba(0,214,143,0.15);
  border: 1px solid rgba(0,214,143,0.3);
  color: var(--green);
  font-size: 13px;
  font-weight: 900;
  padding: 6px 12px;
  border-radius: 100px;
  flex-shrink: 0;
}

/* ── OUTPUT TABS (scroll) ── */
.tab-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 0 8px;
  scrollbar-width: none;
}
.tab-scroll::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  padding: 8px 16px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  background: var(--card);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.tab-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* ── RESULT BLOCKS ── */
.pane { display: none; }
.pane.active { display: block; }

.result-block {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 10px;
  overflow: hidden;
}
.result-block-head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.result-block-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}
.copy-pill {
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 100px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  flex-shrink: 0;
}
.copy-pill.copied { background: rgba(0,214,143,0.15); border-color: var(--green); color: var(--green); }
.result-block-body {
  padding: 14px;
  font-size: 14px;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-all;
}
.result-block-body.large { font-size: 18px; font-weight: 900; line-height: 1.3; }
.result-block-body.accent { color: var(--accent); }
.result-block-body.gold { color: var(--gold); font-weight: 700; }

.tag-wrap {
  padding: 12px 14px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tag {
  background: rgba(255,200,68,0.1);
  border: 1px solid rgba(255,200,68,0.25);
  color: var(--gold);
  padding: 5px 12px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.tag:active { background: rgba(255,200,68,0.2); }

/* timeline */
.tl-item {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.tl-item:last-child { border-bottom: none; }
.tl-time {
  font-size: 11px;
  color: var(--accent);
  font-weight: 700;
  flex-shrink: 0;
  width: 52px;
  margin-top: 2px;
}
.tl-text { font-size: 14px; font-weight: 700; flex: 1; }
.tl-style { font-size: 11px; color: var(--muted); margin-top: 3px; }
.tl-copy {
  flex-shrink: 0;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 16px;
  cursor: pointer;
  padding: 4px;
}

/* canva preview */
.canva-preview {
  margin: 14px;
  border-radius: 12px;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 24px 16px;
  position: relative;
  background: #111;
}
.canva-main { font-size: 24px; font-weight: 900; color: white; text-align: center; }
.canva-sub { font-size: 14px; color: #aaa; text-align: center; }
.canva-badge {
  position: absolute;
  top: 10px; right: 10px;
  background: var(--accent);
  color: white;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
}

/* note lock */
.note-lock {
  background: rgba(255,200,68,0.08);
  border: 1px dashed rgba(255,200,68,0.3);
  border-radius: 10px;
  margin: 10px;
  padding: 12px;
}
.note-lock-header {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

/* reset btn */
.reset-area {
  padding: 20px 0 8px;
  text-align: center;
}
.reset-btn {
  background: none;
  border: 1.5px solid var(--border);
  color: var(--muted);
  border-radius: 100px;
  padding: 10px 24px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

/* ── PRODUCT TABS ── */
.product-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.product-tab {
  flex: 1;
  padding: 10px 8px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  background: var(--card);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.product-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.product-tab.filled {
  border-color: var(--green);
  color: var(--green);
}
.product-tab.filled.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.add-product-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 12px;
  background: var(--card);
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  margin-top: 12px;
}
.add-product-btn:active { background: var(--card2); }
.remove-product-btn {
  background: rgba(255,60,60,0.1);
  border: 1px solid rgba(255,60,60,0.3);
  color: #ff6060;
  border-radius: 100px;
  padding: 6px 14px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
}

/* ── VIDEO GEN ── */
.video-gen-area {
  margin-top: 16px;
  padding: 16px;
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.video-gen-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 100px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.video-gen-btn:disabled { opacity: 0.4; }
.video-preview {
  margin-top: 12px;
  border-radius: 12px;
  overflow: hidden;
}
.video-preview video {
  width: 100%;
  border-radius: 12px;
}
.video-download-btn {
  width: 100%;
  padding: 12px;
  background: var(--green);
  color: var(--bg);
  border: none;
  border-radius: 100px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  margin-top: 8px;
}

/* ── DISCLAIMER ── */
.disclaimer {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(255,200,68,0.08);
  border: 1px solid rgba(255,200,68,0.2);
  border-radius: 8px;
  font-size: 11px;
  color: var(--gold);
  line-height: 1.6;
}

/* ── PROFIT SUMMARY (multi product) ── */
.profit-summary {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 10px;
  overflow: hidden;
}
.profit-summary-item {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.profit-summary-item:last-child { border-bottom: none; }
.profit-summary-name { font-size: 13px; font-weight: 700; }
.profit-summary-num { font-size: 15px; font-weight: 900; color: var(--green); }

/* ── SCAN BUTTON ── */
.scan-btn {
  width: 100%;
  padding: 12px;
  background: rgba(77,159,255,0.1);
  border: 1.5px solid rgba(77,159,255,0.3);
  color: var(--blue);
  border-radius: 100px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.scan-btn:disabled { opacity: 0.4; }
.scan-btn.done { border-color: var(--green); color: var(--green); background: rgba(0,214,143,0.1); }

/* ── API KEY MODAL ── */
.api-modal {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(13,13,20,0.95);
  backdrop-filter: blur(16px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.api-modal.hidden { display: none; }
.api-modal-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 20px;
  max-width: 380px;
  width: 100%;
  text-align: center;
}
.api-modal-card h2 {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 8px;
}
.api-modal-card p {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
  line-height: 1.6;
}
.api-modal-card input {
  width: 100%;
  padding: 12px 14px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  margin-bottom: 14px;
}
.api-modal-card input:focus {
  border-color: var(--accent);
}
.api-modal-card .api-save-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 100px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
}
.api-modal-card .api-save-btn:disabled {
  opacity: 0.4;
}
.api-key-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,214,143,0.1);
  border: 1px solid rgba(0,214,143,0.3);
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
}
.api-key-badge.not-set {
  background: rgba(255,60,60,0.1);
  border-color: rgba(255,60,60,0.3);
  color: #ff6060;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-icon">🏷️</div>
  <h1>せどりAI</h1>
  <div class="header-badge">AUTO</div>
  <div class="api-key-badge not-set" id="apiKeyBadge" onclick="showApiModal()">🔑 未設定</div>
</div>

<!-- PROGRESS -->
<div class="progress">
  <div class="dot active" id="dot0"></div>
  <div class="dot" id="dot1"></div>
  <div class="dot" id="dot2"></div>
  <div class="dot" id="dot3"></div>
</div>

<!-- ══ PAGE 0: 商品情報 ══ -->
<div class="page active" id="page0">

  <div class="sec-label">📦 商品（最大3つまで）</div>
  <div class="product-tabs" id="productTabs"></div>
  <div id="productForms"></div>
  <button class="add-product-btn" id="addProductBtn" onclick="addProduct()">＋ 商品を追加</button>

<script>
// ── state ──
let currentPage = 0;
let result = null;
let products = []; // array of {files, name, category, buyPrice, sellPrice, location, comment}
let activeProductIdx = 0;

// ── API key management ──
function getApiKey() {
  return localStorage.getItem('sedori_api_key') || '';
}
function showApiModal() {
  document.getElementById('apiKeyInput').value = getApiKey();
  document.getElementById('apiModal').classList.remove('hidden');
}
function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (key) {
    localStorage.setItem('sedori_api_key', key);
    document.getElementById('apiModal').classList.add('hidden');
    updateApiKeyBadge();
  }
}
function updateApiKeyBadge() {
  const badge = document.getElementById('apiKeyBadge');
  if (getApiKey()) {
    badge.textContent = '🔑 設定済み';
    badge.classList.remove('not-set');
  } else {
    badge.textContent = '🔑 未設定';
    badge.classList.add('not-set');
  }
}
updateApiKeyBadge();

// ── multi-product management ──
function createProductData() {
  return { files: [], name: '', category: 'おもちゃ・ゲーム', buyPrice: '', sellPrice: '', location: '', comment: '' };
}

function saveCurrentProduct() {
  const form = document.getElementById('productForm-' + activeProductIdx);
  if (!form) return;
  const p = products[activeProductIdx];
  p.name = form.querySelector('.p-name').value;
  p.category = form.querySelector('.p-cat').value;
  p.buyPrice = form.querySelector('.p-buy').value;
  p.sellPrice = form.querySelector('.p-sell').value;
  p.location = form.querySelector('.p-loc').value;
  p.comment = form.querySelector('.p-memo').value;
}

function renderProductTabs() {
  const tabsEl = document.getElementById('productTabs');
  tabsEl.innerHTML = products.map((p, i) => {
    const filled = p.name && p.buyPrice && p.sellPrice;
    return `<button class="product-tab${i === activeProductIdx ? ' active' : ''}${filled ? ' filled' : ''}" onclick="switchProduct(${i})">📦 商品${i + 1}</button>`;
  }).join('');
  document.getElementById('addProductBtn').style.display = products.length >= 3 ? 'none' : 'flex';
}

function renderProductForm(idx) {
  const p = products[idx];
  const formsEl = document.getElementById('productForms');
  formsEl.innerHTML = `
    <div id="productForm-${idx}">
      <div class="sec-label" style="margin-top:12px;">📸 写真・動画</div>
      <input type="file" class="p-file-input" accept="image/*,video/*" multiple style="display:none">
      <div class="upload-box" onclick="this.previousElementSibling.click()">
        <div class="upload-emoji">📁</div>
        <div class="upload-title">タップして選択</div>
        <div class="upload-sub">写真・動画 複数OK</div>
      </div>
      <div class="thumb-row p-thumbs"></div>

      <button class="scan-btn" onclick="scanProduct(${idx})">📷 写真から商品名を読み取る</button>

      <div class="sec-label">💰 商品情報</div>
      <div class="input-card">
        <div class="input-row"><label>商品名</label><input type="text" class="p-name" placeholder="例：レゴ 10302" value="${esc2(p.name)}"></div>
        <div class="input-row"><label>カテゴリー</label>
          <select class="p-cat">
            ${['おもちゃ・ゲーム','家電・スマホ','ブランド品','本・CD・DVD','スポーツ用品','食品・飲料','その他'].map(c => `<option${c===p.category?' selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="input-row"><label>仕入れ値</label><input type="number" class="p-buy" placeholder="2800" inputmode="numeric" value="${p.buyPrice}"></div>
        <div class="input-row"><label>売値</label><input type="number" class="p-sell" placeholder="6500" inputmode="numeric" value="${p.sellPrice}"></div>
        <div class="input-row"><label>仕入れ先</label><input type="text" class="p-loc" placeholder="ドンキ・非公開 など" value="${esc2(p.location)}"></div>
        <div class="input-row"><label>メモ</label><textarea class="p-memo" placeholder="状態・失敗談・ポイントなど">${esc2(p.comment)}</textarea></div>
      </div>
      ${products.length > 1 ? `<button class="remove-product-btn" onclick="removeProduct(${idx})">✕ この商品を削除</button>` : ''}
    </div>
  `;

  // file input
  const fileInput = formsEl.querySelector('.p-file-input');
  fileInput.addEventListener('change', e => { [...e.target.files].forEach(f => addFileToProduct(idx, f)); fileInput.value=''; });

  // render existing thumbs
  renderThumbs(idx);
}

function esc2(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function addFileToProduct(idx, f) {
  products[idx].files.push(f);
  if (idx === activeProductIdx) renderThumbs(idx);
}

// ── scan product from photo ──
async function scanProduct(idx) {
  const p = products[idx];
  const imgFile = p.files.find(f => f.type.startsWith('image/'));
  if (!imgFile) { alert('先に写真を追加してください'); return; }

  const btn = document.querySelector('.scan-btn');
  btn.disabled = true;
  btn.textContent = '📷 読み取り中…';

  try {
    // Compress image before sending (max 800px, quality 0.7)
    const base64 = await compressImage(imgFile, 800, 800, 0.7);

    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
    let result;

    if (isLocal) {
      const localKey = getApiKey();
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localKey}` },
        body: JSON.stringify({
          model: 'meta-llama/llama-4-scout-17b-16e-instruct',
          messages: [{ role: 'user', content: [
            { type: 'text', text: '商品画像から商品名・型番・カテゴリを読み取ってJSONで返して。{"productName":"","modelNumber":"","category":"おもちゃ・ゲーム/家電・スマホ/ブランド品/本・CD・DVD/スポーツ用品/食品・飲料/その他のいずれか"}' },
            { type: 'image_url', image_url: { url: base64 } }
          ]}],
          temperature: 0.3, max_tokens: 300
        })
      });
      const data = await res.json();
      const text = (data.choices?.[0]?.message?.content || '').replace(/```json|```/g, '').trim();
      result = JSON.parse(text);
    } else {
      const apiUrl = window.location.origin + '/api/vision';
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: base64 })
      });
      result = await res.json();
      if (result.error) throw new Error(result.error);
    }

    // Fill form
    const form = document.getElementById('productForm-' + idx);
    if (result.productName) {
      const modelStr = result.modelNumber ? ' ' + result.modelNumber : '';
      form.querySelector('.p-name').value = result.productName + modelStr;
    }
    if (result.category) {
      const sel = form.querySelector('.p-cat');
      const opts = [...sel.options].map(o => o.value);
      if (opts.includes(result.category)) sel.value = result.category;
    }
    saveCurrentProduct();

    btn.textContent = '✓ 読み取り完了';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = '📷 写真から商品名を読み取る'; btn.classList.remove('done'); btn.disabled = false; }, 3000);
  } catch (e) {
    btn.textContent = '📷 写真から商品名を読み取る';
    btn.disabled = false;
    const errDiv = document.getElementById('errorMsg');
    errDiv.textContent = '⚠️ 読み取りエラー: ' + e.message;
    errDiv.style.display = 'block';
  }
}

function renderThumbs(idx) {
  const thumbRow = document.querySelector('.p-thumbs');
  if (!thumbRow) return;
  thumbRow.innerHTML = '';
  const uploadBox = document.querySelector('.upload-box');
  uploadBox.classList.toggle('has-files', products[idx].files.length > 0);

  products[idx].files.forEach((f, fi) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    if (f.type.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      div.appendChild(img);
    } else {
      div.classList.add('thumb-video');
      div.textContent = '🎬';
    }
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕';
    del.onclick = (e) => { e.stopPropagation(); products[idx].files.splice(fi, 1); renderThumbs(idx); };
    div.appendChild(del);
    thumbRow.appendChild(div);
  });
}

function switchProduct(idx) {
  saveCurrentProduct();
  activeProductIdx = idx;
  renderProductTabs();
  renderProductForm(idx);
}

function addProduct() {
  if (products.length >= 3) return;
  saveCurrentProduct();
  products.push(createProductData());
  activeProductIdx = products.length - 1;
  renderProductTabs();
  renderProductForm(activeProductIdx);
}

function removeProduct(idx) {
  products.splice(idx, 1);
  if (activeProductIdx >= products.length) activeProductIdx = products.length - 1;
  renderProductTabs();
  renderProductForm(activeProductIdx);
}

// init first product
products.push(createProductData());
renderProductTabs();
renderProductForm(0);

// ── chips ──
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => c.classList.toggle('on'));
});

// ── main button ──
async function handleMain() {
  if (currentPage === 0) await generate();
}

// ── generate ──
async function generate() {
  saveCurrentProduct();

  // validate all products
  const validProducts = products.filter(p => p.name && p.buyPrice && p.sellPrice);
  if (!validProducts.length) { alert('商品名・仕入れ値・売値を入力してください'); return; }

  const types = [...document.querySelectorAll('.chip.on')].map(c => c.dataset.type);
  if (!types.length) { alert('コンテンツを1つ以上選択してください'); return; }

  const isDeployed = !(location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:');
  if (!isDeployed && !getApiKey()) { showApiModal(); return; }

  const showName = document.getElementById('showName').checked;
  const showPrice = document.getElementById('showPrice').checked;
  const showLocation = document.getElementById('showLocation').checked;

  // build product info text
  const productInfoText = validProducts.map((p, i) => {
    const profit = parseInt(p.sellPrice) - parseInt(p.buyPrice);
    const roi = Math.round(profit / parseInt(p.buyPrice) * 100);
    return `【商品${i+1}】
商品名: ${p.name}
カテゴリー: ${p.category}
仕入れ価格: ${parseInt(p.buyPrice).toLocaleString()}円
売値: ${parseInt(p.sellPrice).toLocaleString()}円
利益: ${profit.toLocaleString()}円（ROI ${roi}%）
仕入れ場所: ${p.location || '非公開'}
メモ: ${p.comment || 'なし'}`;
  }).join('\n\n');

  const noteInstruction = `
note記事での情報公開ルール：
- 商品名：${showName ? '無料部分にも記載してOK' : '商品名は伏せて「ある商品」など表現すること'}
- 仕入れ値・売値：${showPrice ? '有料部分にのみ記載すること（無料部分には載せない）' : '価格情報は一切記載しないこと'}
- 仕入れ先：${showLocation ? '有料部分に記載してOK' : '仕入れ先は伏せて「某店舗」など表現すること'}

note記事のトーン：
- 「これから利益が出そうな注目商品」「今が狙い目」というリサーチ・予測系のトーンで書くこと
- 「〜が値上がり傾向」「相場が動き始めている」「今のうちにチェック」といった表現を使う
- 記事の最後に必ず「※掲載情報は執筆時点のものです。仕入れ・販売はすべて自己責任でお願いします。」の免責文を付ける
`;

  const multiProductNote = validProducts.length > 1
    ? `\n※今回は${validProducts.length}つの商品をまとめて紹介する形式で書くこと。TikTok/Instagram/Canvaは最もインパクトのある商品1つにフォーカスし、noteは全商品をカバーすること。`
    : '';

  const prompt = `あなたはせどり・転売ビジネスのSNSコンテンツ専門家です。

${productInfoText}

【重要な表示ルール】
- TikTok（フック・タイトル・キャプション・テロップ）、Instagram、Canva、動画字幕では「商品名」を出さず、カテゴリー名（例：「家電」「おもちゃ」）だけで表現すること
- note記事でのみ商品名をそのまま使ってOK
- 理由：TikTokやInstagramでは商品を特定されたくないため

${noteInstruction}${multiProductNote}

以下のJSONのみ出力（説明文・コードブロック記号は不要）:
{
  "tiktok":{
    "hook":"最初の3秒キャッチコピー（20字以内・商品名は出さずカテゴリーで）",
    "title":"動画タイトル（30字以内・商品名は出さずカテゴリーで）",
    "caption":"キャプション（150字以内・絵文字多め・商品名は出さずカテゴリーで）",
    "subtitles":["テロップ1","テロップ2","テロップ3","テロップ4","テロップ5"],
    "hashtags":["タグ1","タグ2","タグ3","タグ4","タグ5","タグ6","タグ7","タグ8"]
  },
  "tiktok_studio":{
    "captions":[
      {"text":"字幕1","start":"0:00","end":"0:04","style":"スタイル提案"},
      {"text":"字幕2","start":"0:04","end":"0:08","style":"スタイル提案"},
      {"text":"字幕3","start":"0:08","end":"0:13","style":"スタイル提案"},
      {"text":"字幕4","start":"0:13","end":"0:18","style":"スタイル提案"},
      {"text":"字幕5","start":"0:18","end":"0:23","style":"スタイル提案"},
      {"text":"字幕6","start":"0:23","end":"0:28","style":"スタイル提案"},
      {"text":"字幕7","start":"0:28","end":"0:30","style":"CTAスタイル"}
    ],
    "bgm_mood":"おすすめBGM雰囲気",
    "edit_tips":"編集ポイント（箇条書き2〜3点）"
  },
  "instagram":{
    "post_text":"投稿文（300字以内・改行あり・絵文字あり）",
    "story_text":"ストーリーズテキスト（50字以内）",
    "hashtags":["タグ1","タグ2","タグ3","タグ4","タグ5","タグ6","タグ7","タグ8","タグ9","タグ10"]
  },
  "canva":{
    "main":"メインテキスト（20字以内・インパクト重視）",
    "sub":"サブテキスト（30字以内）",

    "color":"カラーテーマ（例：黒×オレンジ×白）",
    "layout_tip":"Canva配置アドバイス（1〜2文）",
    "story_overlay":"ストーリーズオーバーレイテキスト（20字以内）"
  },
  "note":{
    "title":"記事タイトル（読みたくなるもの）",
    "free_lead":"無料リード文（200字・続きを読みたくなる終わり方）",
    "paid_body":"有料本文（目利きポイント・仕入れコツ・注意点など600字程度・末尾に免責文）",
    "cta":"有料購読誘導文（50字以内）"
  }
}

日本語・せどり初〜中級者向け・リアルで共感しやすいトーンで。`;

  // loading
  document.getElementById('errorMsg').style.display = 'none';
  showLoading(true);
  const msgs = ['商品情報を分析中…','TikTok字幕を生成中…','Instagram文を作成中…','Canvaサムネを構成中…','note記事を執筆中…','ハッシュタグ選定中…','仕上げ中…'];
  let mi = 0;
  const iv = setInterval(() => { document.getElementById('loadingSub').textContent = msgs[mi++ % msgs.length]; }, 1200);

  try {
    const localKey = getApiKey();
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';
    const useDirectApi = isLocal && localKey;

    let raw;
    if (useDirectApi) {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localKey}` },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: [{ role: 'user', content: prompt }],
          temperature: 0.8, max_tokens: 4096,
          response_format: { type: 'json_object' }
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(`APIエラー ${res.status}: ${JSON.stringify(data)}`);
      raw = (data.choices?.[0]?.message?.content || '').replace(/```json|```/g, '').trim();
    } else {
      const fetchHeaders = { 'Content-Type': 'application/json' };
      if (localKey) fetchHeaders['x-api-key'] = localKey;
      const apiUrl = window.location.origin + '/api/generate';
      const res = await fetch(apiUrl, { method: 'POST', headers: fetchHeaders, body: JSON.stringify({ prompt }) });
      const data = await res.json();
      if (!res.ok) throw new Error(`APIエラー ${res.status}: ${JSON.stringify(data)}`);
      raw = (data.text || '').replace(/```json|```/g, '').trim();
    }

    let result;
    try { result = JSON.parse(raw); } catch(pe) { throw new Error('JSON解析エラー。AIの返答:\n' + raw.slice(0, 300)); }

    clearInterval(iv);
    showLoading(false);

    // compute totals
    const totalProfit = validProducts.reduce((s, p) => s + (parseInt(p.sellPrice) - parseInt(p.buyPrice)), 0);

    const totalSell = validProducts.reduce((s, p) => s + parseInt(p.sellPrice), 0);
    const totalRoi = Math.round(totalProfit / totalBuy * 100);

    renderResult(result, types, totalProfit, totalRoi, totalBuy, totalSell, validProducts);
    goPage(3);

  } catch(e) {
    clearInterval(iv);
    showLoading(false);
    const errDiv = document.getElementById('errorMsg');
    errDiv.textContent = '⚠️ ' + e.message;
    errDiv.style.display = 'block';
    console.error(e);
  }
}

// ── render result ──
function renderResult(r, types, profit, roi, buy, sell, prods) {
  // profit bar
  let profitHtml = `<div class="profit-bar">
    <div>
      <div class="profit-num">+¥${profit.toLocaleString()}</div>
      <div class="profit-detail">仕入れ ¥${buy.toLocaleString()} → 売値 ¥${sell.toLocaleString()}</div>
    </div>
    <div class="roi-badge">ROI ${roi}%</div>
  </div>`;

  if (prods && prods.length > 1) {
    profitHtml += '<div class="profit-summary">';
    prods.forEach(p => {
      const pr = parseInt(p.sellPrice) - parseInt(p.buyPrice);
      profitHtml += `<div class="profit-summary-item">
        <span class="profit-summary-name">${p.name}</span>
        <span class="profit-summary-num">+¥${pr.toLocaleString()}</span>
      </div>`;
    });
    profitHtml += '</div>';
  }
  document.getElementById('profitBar').innerHTML = profitHtml;

  const tabScroll = document.getElementById('tabScroll');
  const panesEl = document.getElementById('panes');
  tabScroll.innerHTML = ''; panesEl.innerHTML = '';

  const labels = {

        ${block('🎬 字幕テロップ', t.subtitles.map((s,i)=>`${i+1}. ${s}`).join('\n'), '')}
        <div class="result-block">
          <div class="result-block-head">
            <span class="result-block-label">#️⃣ ハッシュタグ</span>
            <button class="copy-pill" onclick="cp(this, '${esc(t.hashtags.map(h=>'#'+h.replace(/^#/,'')).join(' '))}')">全コピー</button>
          </div>
          <div class="tag-wrap">${t.hashtags.map(h=>{h=h.replace(/^#/,'');return`<span class="tag" onclick="cp(this,'#${esc(h)}')">#${h}</span>`;}).join('')}</div>
        </div>
      `;
    }

    // tiktok_studio: UIには表示しない（動画生成で内部使用）
    if (type === 'tiktok_studio') { pane.remove(); return; }

    if (type === 'instagram' && r.instagram) {
      const ig = r.instagram;
      pane.innerHTML = `
        ${block('📸 投稿文', ig.post_text, '')}
        ${block('📲 ストーリーズ', ig.story_text, 'large')}
        <div class="result-block">
          <div class="result-block-head">
            <span class="result-block-label">#️⃣ ハッシュタグ</span>
            <button class="copy-pill" onclick="cp(this,'${esc(ig.hashtags.map(h=>'#'+h.replace(/^#/,'')).join(' '))}')">全コピー</button>
          </div>
          <div class="tag-wrap">${ig.hashtags.map(h=>`<span class="tag" onclick="cp(this,'#${esc(h)}')">#${h}</span>`).join('')}</div>

    if (type === 'canva' && r.canva) {

    if (type === 'note' && r.note) {

    window._lastProducts = prods;

      <div class="video-gen-area">
        <div class="sec-label" style="margin-top:0;">🎬 動画を自動生成</div>

          画像にはモザイクがかかります。

        <button class="video-gen-btn" id="videoGenBtn" onclick="generateVideo()">
          🎬 動画を生成する

// ── video generation ──
async function generateVideo() {
  const btn = document.getElementById('videoGenBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 動画を生成中…';
  const resultDiv = document.getElementById('videoResult');
  resultDiv.innerHTML = '<p style="font-size:12px;color:var(--muted);margin-top:12px;">Shotstack APIで動画をレンダリング中… 30秒〜1分ほどかかります</p>';

  try {
    const r = window._lastResult;
    const prods = window._lastProducts || [];

    // 商品画像をアップロードしてURL取得
    let imageUrl = null;
    const prodWithImage = prods.find(p => p.files && p.files.some(f => f.type.startsWith('image/')));
    if (prodWithImage) {
      btn.textContent = '⏳ 画像をアップロード中…';
      const imgFile = prodWithImage.files.find(f => f.type.startsWith('image/'));
      const imageData = await compressImage(imgFile, 540, 960, 0.6);
      const uploadRes = await fetch(window.location.origin + '/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: imageData })
      });
      const uploadData = await uploadRes.json();
      if (uploadData.url) imageUrl = uploadData.url;
    }

    btn.textContent = '⏳ 動画を生成中…';
    const payload = {
      action: 'render',
      captions: r.tiktok_studio.captions,
      hook: r.tiktok.hook,
      priceBadge: r.canva.price_badge,
      imageUrl
    };

    // Start render
    const localKey = getApiKey();
    const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.protocol === 'file:';

    let renderId;
    if (isLocal) {
      throw new Error('動画生成はVercelデプロイ後に使えます。Shotstack APIキーをVercel環境変数に設定してください。');
    }

    const headers = { 'Content-Type': 'application/json' };
    const res = await fetch('/api/video', { method: 'POST', headers, body: JSON.stringify(payload) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `APIエラー ${res.status}`);
    renderId = data.renderId;

    // Poll for completion
    let videoUrl = null;
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 3000));
      const statusRes = await fetch('/api/video', {
        method: 'POST', headers,
        body: JSON.stringify({ action: 'status', renderId })
      });
      const statusData = await statusRes.json();
      if (statusData.status === 'done' && statusData.url) {
        videoUrl = statusData.url;
        break;
      } else if (statusData.status === 'failed') {
        throw new Error('動画の生成に失敗しました');
      }
      btn.textContent = `⏳ レンダリング中… ${i * 3}秒`;
    }

    if (!videoUrl) throw new Error('タイムアウト：動画の生成に時間がかかりすぎました');

    resultDiv.innerHTML = `
      <div class="video-preview" style="margin-top:12px;">
        <video src="${videoUrl}" controls playsinline style="width:100%;max-height:400px;border-radius:12px;"></video>
      </div>
      <a href="${videoUrl}" download="sedori-video.mp4" class="video-download-btn" style="display:block;text-align:center;text-decoration:none;margin-top:8px;">
        📥 動画をダウンロード
      </a>
    `;
    btn.textContent = '✓ 生成完了';
  } catch (e) {
    resultDiv.innerHTML = `<p style="font-size:12px;color:#ff6060;margin-top:12px;">⚠️ ${e.message}</p>`;
    btn.textContent = '🎬 動画を生成する';
    btn.disabled = false;
  }
}

// ── mosaic image processing ──
function compressImage(file, maxW, maxH, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = maxW;
      canvas.height = maxH;
      const ctx = canvas.getContext('2d');

      // Fill with dark background
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, maxW, maxH);

      // Draw image to cover canvas
      const scale = Math.max(maxW / img.width, maxH / img.height);
      const w = img.width * scale;
      const h = img.height * scale;
      ctx.drawImage(img, (maxW - w) / 2, (maxH - h) / 2, w, h);

      // Dark overlay for text readability
      ctx.fillStyle = 'rgba(13,13,20,0.45)';
      ctx.fillRect(0, 0, maxW, maxH);

      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = URL.createObjectURL(file);
  });
}

function block(label, text, bodyClass) {
  const id = 'b' + Math.random().toString(36).slice(2);
  return `
    <div class="result-block">
      <div class="result-block-head">
        <span class="result-block-label">${label}</span>
        <button class="copy-pill" id="${id}" onclick="cp(this,'${esc(text)}')">コピー</button>
      </div>
      <div class="result-block-body ${bodyClass||''}">${text}</div>
    </div>
  `;
}

function esc(s) {
  if (Array.isArray(s)) s = s.join('\n');
  if (typeof s !== 'string') s = String(s || '');
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
}

function cp(btn, text) {
  const decoded = text.replace(/\\n/g,'\n').replace(/\\'/g,"'").replace(/\\\\/g,'\\');
  navigator.clipboard.writeText(decoded).then(() => {
    btn.textContent = '✓ コピー済み';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
  });
}

// ── page nav ──
function goPage(n) {
  document.querySelectorAll('.page').forEach((p,i) => p.classList.toggle('active', i === n || (n===3 && i===3)));
  // fix: show page3 which is index 1 in DOM
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  if (n === 0) document.getElementById('page0').classList.add('active');
  if (n === 3) document.getElementById('page3').classList.add('active');
  currentPage = n;
  updateDots();
  updateBtn();
  window.scrollTo(0, 0);
}

function updateDots() {
  const pageIdx = currentPage === 3 ? 3 : currentPage;
  [0,1,2,3].forEach(i => {
    const d = document.getElementById('dot'+i);
    d.classList.remove('active','done');
    if (i < pageIdx) d.classList.add('done');
    else if (i === pageIdx) d.classList.add('active');
  });
}

function updateBtn() {
  const btn = document.getElementById('mainBtn');
  if (currentPage === 0) { btn.textContent = '⚡ AIでコンテンツを生成'; btn.style.display = 'flex'; }
  else { btn.style.display = 'none'; }
}

function showLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
}

function reset() {
  result = null;
  products = [createProductData()];
  activeProductIdx = 0;
  renderProductTabs();
  renderProductForm(0);
  document.querySelectorAll('.chip').forEach(c => c.classList.add('on'));
  document.getElementById('videoArea').innerHTML = '';
  goPage(0);
}
